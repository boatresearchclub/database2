name: BRC Four-Workstream Source Gates (READ ONLY)
on:
  workflow_dispatch:
  push:
    branches:
      - brc-four-track-source-gates-20261024
    paths:
      - 'scripts/brc_four_workstream_readiness.py'
      - 'scripts/test_four_workstream_readiness.py'
      - 'scripts/brc_scenario_123_research.py'
      - 'scripts/brc_scenario_123_official_k.py'
      - 'scripts/test_scenario_123_official_k.py'
      - 'scripts/brc_motor_previous_k_summaries.py'
      - 'scripts/test_motor_previous_k_summaries.py'
      - 'scripts/brc_true_timex_effect_research.py'
      - 'scripts/test_true_timex_effect_research.py'
      - '.github/workflows/brc-four-feature-gate-audit.yml'
  pull_request:
    paths:
      - 'scripts/brc_four_workstream_readiness.py'
      - 'scripts/test_four_workstream_readiness.py'
      - 'scripts/brc_scenario_123_research.py'
      - 'scripts/brc_scenario_123_official_k.py'
      - 'scripts/test_scenario_123_official_k.py'
      - 'scripts/brc_motor_previous_k_summaries.py'
      - 'scripts/test_motor_previous_k_summaries.py'
      - 'scripts/brc_true_timex_effect_research.py'
      - 'scripts/test_true_timex_effect_research.py'
      - '.github/workflows/brc-four-feature-gate-audit.yml'
permissions:
  contents: read
jobs:
  offline-safety-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure offline regression tests
        run: python scripts/test_four_workstream_readiness.py
      - name: Verify 1st-2nd-3rd conditional research aggregation
        run: python scripts/brc_scenario_123_research.py --self-test
      - name: Official-K conditional-matrix offline fixtures
        run: python scripts/test_scenario_123_official_k.py
      - name: Verified previous-motor offline fixtures
        run: python scripts/test_motor_previous_k_summaries.py
      - name: True TimeX original-outcome cohort fixtures
        run: python scripts/test_true_timex_effect_research.py
      - name: v3 official B-file and reviewed meeting preflight (NO WORKER)
        continue-on-error: true
        run: python scripts/brc_v3_stage_daily.py --summary brc_v3_offline_summary.json
      - name: Read-only audit of four research feature sources
        run: python scripts/brc_four_workstream_readiness.py --out brc_four_workstream_readiness.json
      - name: Explain what this job does not release
        if: always()
        shell: bash
        run: |
          echo '## BRC: research gate audit only' >> "$GITHUB_STEP_SUMMARY"
          echo 'No deployed INDEX, probabilities, KV, live Worker or public UI changed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brc-four-workstreams-readonly
          path: |
            brc_four_workstream_readiness.json
            brc_v3_offline_summary.json
          if-no-files-found: ignore
          retention-days: 7
