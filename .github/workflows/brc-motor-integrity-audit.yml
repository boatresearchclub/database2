name: BRC Motor Source Integrity Audit (NO PUBLISH)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brc-motor-integrity-audit.yml'
  schedule:
    - cron: '5 2 * * *'
permissions:
  contents: read
jobs:
  read-only-motor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current public BRC snapshot (read-only)
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current motor snapshot without publishing values
        shell: bash
        run: |
          python - <<'PY'
          import csv,io,json,pathlib,re,urllib.request
          from datetime import datetime,timedelta,timezone
          JST=timezone(timedelta(hours=9))
          manifest=json.loads(pathlib.Path('data/.brc_split_manifest.json').read_text(encoding='utf-8'))
          files=[x for x in manifest['files'] if re.fullmatch(r'data-motor-detail-[a-f0-9]+-001\\.js',x)]
          if len(files)!=1:raise ValueError('Expected exactly one BRC motor baseline chunk')
          content=(pathlib.Path('data')/files[0]).read_text(encoding='utf-8')
          parts=re.findall(r'e\\.textContent\\s*\\+=\\s*("(?:\\\\.|[^"\\\\])*")',content,re.S)
          if not parts:raise ValueError('Motor source JSON could not be decoded')
          base=json.loads(''.join(json.loads(x) for x in parts))
          if base.get('date')!='2026-09-05' or len(base.get('venues',{}))!=24:
              raise ValueError('Unexpected original motor reference')
          names=('桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村').split()
          target=datetime.now(JST).date()-timedelta(days=1)
          data=None;asof=''
          for i in range(4):
              day=target-timedelta(days=i)
              url=f'https://raw.githubusercontent.com/BoatraceCSV/boatracecsv.github.io/main/data/programs/motor_stats/{day:%Y/%m/%d}.csv'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BRC-Motor-Integrity/1'}),timeout=25) as resp:
                      if resp.status!=200:continue
                      raw=resp.read(500000)
                  data=list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))))
                  if len(data)<100:raise ValueError('Too few motor source rows')
                  asof=day.isoformat()
                  break
              except Exception as ex:
                  print('Read-only source probe:',day,type(ex).__name__,str(ex)[:140])
          if data is None:raise ValueError('No usable recent motor source')
          mismatches=[];same_cycle=0;other_cycle=0;covered=set()
          for row in data:
              code=row['場コード']
              if not code.isdigit() or not 1<=int(code)<=24:raise ValueError('Bad venue code')
              venue=names[int(code)-1];covered.add(venue)
              motor=str(int(row['モーター番号']))
              old=base['venues'][venue]['motors'].get(motor)
              if not old:continue
              if row['モーター期起算日']!=base['venues'][venue]['cycle_start']:
                  other_cycle+=1;continue
              same_cycle+=1
              if int(row['出走数'])<int(old['n']):
                  mismatches.append({'venue':venue,'motor':motor,'old_n':old['n'],
                      'new_source_n':int(row['出走数']),'date':row['記録日']})
          report={'date':asof,'reference_date':base['date'],'covered_venues':len(covered),
              'same_cycle_motor_count':same_cycle,
              'motor_n_regressions':len(mismatches),'different_cycle_count':other_cycle,
              'examples':mismatches[:25],
              'source':'BoatraceCSV motor_stats public daily snapshots',
              'release_decision':'NO_GO',
              'published':False,
              'reason':'Daily source is not proven equivalent to complete-cycle BRC counts; verified per-meet history and finals not integrated'}
          pathlib.Path('motor_integrity_audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='examples'},ensure_ascii=False))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## Motor source audit: NO PUBLISH\\n')
              f.write(f'As of {asof}; same-cycle {same_cycle}; N regressions {len(mismatches)}.\\n')
              f.write('No BRC user-facing motor history, index, or predictions were changed.\\n')
          PY
      - name: Save source audit for developer investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brc-motor-readonly-audit
          path: motor_integrity_audit.json
          if-no-files-found: ignore
          retention-days: 14
