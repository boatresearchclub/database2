name: BRC True TimeX - staging reachability (read-only)
on:
  push:
    branches:
      - research/shin-timex-readonly-probe-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unauthenticated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check unauthenticated GET and CORS OPTIONS only
        shell: bash
        env:
          STAGING_V3_URL: https://brc-timex-v3-test.sk48159212.workers.dev
          STAGING_LIVE_URL: https://brc-live-exhibition.sk48159212.workers.dev
        run: |
          set -uo pipefail
          get_probe () {
            label="$1"; url="$2"
            result=$(curl --silent --show-error --max-redirs 0 --connect-timeout 8 --max-time 15 --retry 0 --output /dev/null --write-out '%{http_code} %{content_type}' -- "$url") || {
              echo "$label transport_error (not a service health verdict)"
              return
            }
            echo "$label HTTP=$result"
          }
          options_probe () {
            label="$1"; origin="$2"
            headers=$(mktemp)
            status=$(curl --silent --show-error --max-redirs 0 --connect-timeout 8 --max-time 15 --retry 0 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              --request OPTIONS --header "Origin: $origin" --header 'Access-Control-Request-Method: POST' \
              -- "$STAGING_V3_URL/predict-timex-v3") || {
              echo "$label transport_error"
              rm -f "$headers"
              return
            }
            allowed=$(grep -i '^access-control-allow-origin:' "$headers" | head -1 | tr -d '\r' | cut -d':' -f2- | sed 's/^ *//' || true)
            case "$allowed" in
              https://brcdatabase.pages.dev) summary='configured_public_origin' ;;
              '') summary='missing_acao' ;;
              *) summary='other_acao' ;;
            esac
            echo "$label HTTP=$status ACAO=$summary"
            rm -f "$headers"
          }
          get_probe stage_root "$STAGING_V3_URL/"
          get_probe stage_predict_get "$STAGING_V3_URL/predict-timex-v3"
          get_probe live_root "$STAGING_LIVE_URL/"
          get_probe live_health "$STAGING_LIVE_URL/health"
          get_probe live_exhibition_missing_args "$STAGING_LIVE_URL/live-exhibition"
          options_probe cors_expected https://brcdatabase.pages.dev
          options_probe cors_unexpected https://example.invalid
          echo 'Unauthenticated network contract only. No POST, no credentials, no deployment, no D1 access.'
      - name: Check public health flags and KV schedule status without writes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base='https://brc-live-exhibition.sk48159212.workers.dev'
          def query(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path,method='GET'),timeout=15) as r:
                      status=r.status
                      raw=r.read(2_000_000)
                      return status,json.loads(raw)
              except urllib.error.HTTPError as e:
                  return e.code,{}
              except Exception:
                  return 'TRANSPORT_ERROR',{}
          status,data=query('/health')
          keys=['ok','service','phase','result_store','result_store_bound','schedule','result']
          safe={k:data[k] for k in keys if k in data and isinstance(data[k],(str,bool,int,float))}
          print('live_health_details',json.dumps({'http':status,'fields':safe},ensure_ascii=False,sort_keys=True))
          for date in ('2026-10-19','2026-10-20'):
              status,data=query('/live-schedule?date='+date)
              schedule=data.get('schedule') if isinstance(data,dict) else None
              shape=type(schedule).__name__ if schedule is not None else 'none'
              print('live_schedule_details',json.dumps({'date':date,'http':status,'schedule_type':shape,'schedule_size':len(schedule) if isinstance(schedule,(dict,list)) else None}))
          print('GET result endpoint intentionally excluded: archived Worker may execute CREATE TABLE IF NOT EXISTS.')
          PY
