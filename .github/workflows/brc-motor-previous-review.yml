name: BRC Motor Previous Meet Verified Daily Feed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brc-motor-previous-review.yml'
      - 'scripts/BRC_MOTOR_PREVIOUS_FEED_V1.py'
      - 'scripts/test_motor_previous_feed_v1.py'
      - 'scripts/BRC_MOTOR_PREVIOUS_VERIFY_K_V1.py'
      - 'scripts/BRC_MOTOR_PREVIOUS_RELEASE_V1.py'
      - 'scripts/test_motor_previous_release_v1.py'
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: write

concurrency:
  group: brc-motor-previous-review
  cancel-in-progress: false

jobs:
  read-only-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provenance and 24-venue safety tests
        run: |
          python scripts/test_motor_previous_feed_v1.py
          python scripts/test_motor_previous_release_v1.py
      - name: Build dated third-party review only, do not publish
        shell: bash
        run: |
          python scripts/BRC_MOTOR_PREVIOUS_FEED_V1.py \
            --output .cache/motor_previous_review.json
      - name: Restore verified daily official K archive
        uses: actions/cache/restore@v4
        with:
          path: .cache/brc-course365-k
          key: brc-motor-previous-k-readonly
          restore-keys: |
            brc-course365-k-
      - name: Cross-check motor/racer/date against official K archive
        shell: bash
        run: |
          python scripts/BRC_MOTOR_PREVIOUS_VERIFY_K_V1.py \
            --feed .cache/motor_previous_review.json \
            --output .cache/motor_previous_official_K_audit.json
      - name: Release only independently verified previous-user fields (not motor N)
        shell: bash
        run: |
          python scripts/BRC_MOTOR_PREVIOUS_RELEASE_V1.py \
            --feed .cache/motor_previous_review.json \
            --audit .cache/motor_previous_official_K_audit.json \
            --output racecards/motor_previous_daily.json
      - name: Commit only independently verified dated previous-user feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BRC Motor Previous Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- racecards/motor_previous_daily.json
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m 'data: update K-verified motor previous-meet identity snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve review for human verification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brc-motor-previous-review-no-publish
          path: |
            .cache/motor_previous_review.json
            .cache/motor_previous_official_K_audit.json
          if-no-files-found: ignore
          retention-days: 14
