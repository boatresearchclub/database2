name: BRC Motor Official K Historical Audit (NO PUBLISH)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brc-motor-official-k-audit.yml'
permissions:
  contents: read
jobs:
  historical-motor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified official K files from prior course365 runs
        uses: actions/cache/restore@v4
        with:
          path: .cache/brc-course365-k
          key: brc-motor-k-audit-no-write
          restore-keys: |
            brc-course365-k-
      - name: Count actual official K motor starts versus frozen BRC baseline
        shell: bash
        run: |
          python - <<'PY'
          import collections,json,pathlib,re,sys
          from datetime import date,timedelta
          sys.path.insert(0,'scripts')
          import BRC_PLAYER_COURSE365_V3_OFFICIAL as official
          manifest=json.loads(pathlib.Path('data/.brc_split_manifest.json').read_text(encoding='utf-8'))
          files=[f for f in manifest['files'] if re.fullmatch(r'data-motor-detail-[0-9a-f]+-001\.js',f)]
          if len(files)!=1:raise ValueError('BRC motor reference missing')
          js=(pathlib.Path('data')/files[0]).read_text(encoding='utf-8')
          chunks=re.findall(r'e\.textContent\s*\+=\s*("(?:\\.|[^"\\])*")',js,re.S)
          if not chunks:raise ValueError('Motor reference decoder failed')
          base=json.loads(''.join(json.loads(s) for s in chunks))
          if base.get('date')!='2026-09-05':raise ValueError('Unexpected baseline date')
          venues='桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村'.split()
          venue_by_code={f'{i:02d}':n for i,n in enumerate(venues,1)}
          root=pathlib.Path('.cache/brc-course365-k')
          official_files=official.discover_k(root) if root.exists() else {}
          start=date(2025,9,23);end=date(2026,9,5);day=start
          counts=collections.Counter();status_counts=collections.Counter();unparsed_codes=collections.Counter();unparsed_samples=[];no_finisher_codes=collections.Counter();other_start_counts=collections.Counter();missing=[];errors=[];days_good=0;joined=0
          motor_pat=re.compile(r'\s+(\d{1,3})\s+\d{1,3}\s+\d(?:\.\d{1,2})?\s+[1-6]\s+')
          venue_pat=official.RE_VENUE_START;end_pat=official.RE_VENUE_END
          while day<=end:
              file=official_files.get(day)
              if file is None:
                  missing.append(day.isoformat());day+=timedelta(days=1);continue
              try:
                  content=file.read_text(encoding='cp932',errors='strict')
                  events,n_races,_=official.official_k_events(content,day)
                  expected={(v,r,b,reg,rank) for _,v,r,b,reg,_,rank in events}
                  completed={(v,r) for _,v,r,b,reg,_,rank in events}
                  matches={};venue=None;race=None
                  for line in content.splitlines():
                      v=venue_pat.match(line)
                      if v:venue=v.group(1);race=None;continue
                      if end_pat.match(line):venue=None;race=None;continue
                      if venue is None:continue
                      rm=official.RE_RACE.match(line)
                      if rm:race=int(rm.group(1));continue
                      if race is None:continue
                      m=official.RE_ENTRY.match(line)
                      if not m:
                          if (venue,race) in completed and motor_pat.search(line):
                              detected=re.match(r'^\s*(\S+)\s+([1-6])\s+\d{4}\s+',line)
                              if detected:
                                  unparsed_codes[detected.group(1)]+=1
                                  motor=motor_pat.search(line)
                                  vname=venue_by_code[venue];meta=base['venues'][vname]
                                  if motor and meta['cycle_start']<=day.isoformat()<meta['event_start']:
                                      other_start_counts[(vname,str(int(motor.group(1))),detected.group(1))]+=1
                                  if len(unparsed_samples)<40:
                                      unparsed_samples.append({'date':day.isoformat(),'venue':venue,'race':race,'label':detected.group(1),'sample':line[:150]})
                          continue
                      rank_s,boat_s,reg,body=m.groups()
                      if (venue,race) not in completed and not rank_s.isdigit():
                          no_finisher_codes[rank_s]+=1
                          motor=motor_pat.search(body)
                          vname=venue_by_code[venue];meta=base['venues'][vname]
                          if motor and meta['cycle_start']<=day.isoformat()<meta['event_start']:
                              other_start_counts[(vname,str(int(motor.group(1))),'NF_'+rank_s)]+=1
                      if not rank_s.isdigit():
                          if (venue,race) in completed:
                              stat_motor=motor_pat.search(body)
                              if stat_motor is not None:
                                  vname=venue_by_code[venue];meta=base['venues'][vname]
                                  if meta['cycle_start']<=day.isoformat()<meta['event_start']:
                                      status_counts[(vname,str(int(stat_motor.group(1))),rank_s)]+=1
                          continue
                      if not 1<=int(rank_s)<=6:continue
                      key=(venue,race,int(boat_s),reg,int(rank_s))
                      if key not in expected:continue
                      mm=motor_pat.search(body)
                      if mm is None:raise ValueError('No motor for validated numeric finisher '+str(key))
                      if key in matches:raise ValueError('Duplicate finisher')
                      matches[key]=str(int(mm.group(1)))
                  if set(matches)!=expected:
                      raise ValueError(f'Motor/race join incomplete: {len(matches)}/{len(expected)}')
                  for (code,race,boat,reg,rank),motor in matches.items():
                      name=venue_by_code[code];meta=base['venues'][name]
                      if meta['cycle_start']<=day.isoformat()<meta['event_start']:
                          counts[name,motor]+=1
                  days_good+=1;joined+=len(matches)
              except Exception as err:
                  if len(errors)<35:errors.append(f'{day} {type(err).__name__}: {str(err)[:160]}')
              day+=timedelta(days=1)
          exact=0;compared=0;examples=[];variants={}
          for venue,meta in base['venues'].items():
              if meta['cycle_start']<start.isoformat():continue
              for motor,record in meta['motors'].items():
                  compared+=1;got=counts.get((venue,motor),0);expected_n=int(record['n'])
                  if got==expected_n:exact+=1
                  elif len(examples)<30:
                      examples.append({'venue':venue,'motor':motor,'old_n':expected_n,'official_numeric_finishes':got})
          for label,accepted in [
              ('numeric_only',set()),('plus_F_L',{'F','L'}),
              ('plus_S',{'S0','S1','S2'}),
              ('plus_F_L_S',{'F','L','S0','S1','S2'}),
              ('plus_accidents',{'転','失','妨','落','沈','エ'}),
              ('plus_F_L_accidents',{'F','L','転','失','妨','落','沈','エ'}),
              ('all_nonabsent',{'F','L','S0','S1','S2','転','失','妨','落','沈','エ'})]:
              total=0;matches=0;mae=0
              for vname,meta in base['venues'].items():
                  if meta['cycle_start']<start.isoformat():continue
                  for mno,record in meta['motors'].items():
                      n=counts.get((vname,mno),0)+sum(status_counts.get((vname,mno,st),0) for st in accepted)
                      total+=1;matches+=int(n==int(record['n']));mae+=abs(n-int(record['n']))
              variants[label]={'exact':matches,'total':total,'absolute_difference_sum':mae}
          # Exhaustive research diagnostics over observed status candidates;
          # this does not select production count policy.
          all_st=['F','S0','S1','S2','L0','L1','NF_F','NF_S1','NF_S0','NF_S2']
          for mask in range(1<<len(all_st)):
              allowed={st for k,st in enumerate(all_st) if mask&(1<<k)}
              count=0;good=0;distance=0
              for vname,meta in base['venues'].items():
                  if meta['cycle_start']<start.isoformat():continue
                  for mno,record in meta['motors'].items():
                      n=counts.get((vname,mno),0)+sum(status_counts.get((vname,mno,st),0)+other_start_counts.get((vname,mno,st),0) for st in allowed)
                      count+=1;good+=int(n==int(record['n']));distance+=abs(n-int(record['n']))
              variants['subset_'+('_'.join(sorted(allowed)) if allowed else 'none')]={'exact':good,'total':count,'absolute_difference_sum':distance}
          # Independent holdout diagnostics: a retrospective best fit is NOT
          # evidence that the counting policy is valid for future releases.
          candidate={'F','L1','NF_F','NF_S1','NF_S2','S1','S2'}
          candidate_residual_by_venue={}
          candidate_residual_samples=[]
          for vname,meta in base['venues'].items():
              if meta['cycle_start']<start.isoformat():continue
              for mno,record in meta['motors'].items():
                  derived=counts.get((vname,mno),0)+sum(
                      status_counts.get((vname,mno,st),0)+other_start_counts.get((vname,mno,st),0)
                      for st in candidate)
                  delta=derived-int(record['n'])
                  if delta:
                      item=candidate_residual_by_venue.setdefault(vname,{'motors':0,'signed_delta_sum':0,'absolute_delta_sum':0})
                      item['motors']+=1;item['signed_delta_sum']+=delta;item['absolute_delta_sum']+=abs(delta)
                      if len(candidate_residual_samples)<120:
                          candidate_residual_samples.append({'venue':vname,'motor':mno,'baseline_n':record['n'],'candidate_n':derived,'delta':delta,'cycle_start':meta['cycle_start'],'excluded_meet_start':meta['event_start']})
          # Diagnostic hypotheses only: identify whether residuals cluster
          # at the baseline meeting boundary, and their exact magnitudes.
          candidate_residual_delta_histogram={}
          candidate_residual_boundary_groups={'meet_start_on_snapshot':{'motors':0,'abs_delta':0},
              'meet_start_after_snapshot':{'motors':0,'abs_delta':0},
              'other':{'motors':0,'abs_delta':0}}
          for sample in candidate_residual_samples:
              delta=sample['delta']
              key=str(delta)
              candidate_residual_delta_histogram[key]=candidate_residual_delta_histogram.get(key,0)+1
              meet=sample['excluded_meet_start']
              bucket=('meet_start_on_snapshot' if meet==base['date'] else
                  'meet_start_after_snapshot' if meet>base['date'] else 'other')
              candidate_residual_boundary_groups[bucket]['motors']+=1
              candidate_residual_boundary_groups[bucket]['abs_delta']+=abs(delta)
          best_variants=sorted(({'policy':key,**val} for key,val in variants.items()),
              key=lambda x:(x['absolute_difference_sum'],-x['exact']))[:12]
          # Venue-specific diagnostic: independent best subset is useful for
          # tracing inconsistent source conventions but NEVER authorizes
          # per-venue production policies (would overfit frozen snapshot).
          per_venue_best={}
          for vname,meta in base['venues'].items():
              if meta['cycle_start']<start.isoformat():continue
              venue_candidates=[]
              for mask in range(1<<len(all_st)):
                  allowed={st for k,st in enumerate(all_st) if mask&(1<<k)}
                  exact_for_venue=0;abs_error=0;num=0
                  for mno,record in meta['motors'].items():
                      n=counts.get((vname,mno),0)+sum(
                        status_counts.get((vname,mno,st),0)+other_start_counts.get((vname,mno,st),0)
                        for st in allowed)
                      abs_error+=abs(n-int(record['n']))
                      exact_for_venue+=int(n==int(record['n']))
                      num+=1
                  venue_candidates.append((abs_error,-exact_for_venue,mask,num))
              venue_candidates.sort()
              error,negmatches,mask,total=venue_candidates[0]
              per_venue_best[vname]={'total':total,'exact':-negmatches,
                  'absolute_difference_sum':error,
                  'candidate_statuses':[st for k,st in enumerate(all_st) if mask&(1<<k)]}
          preferred={'F','S1','S2','L0','L1'};residual=[];venue_residual={}
          for vname,meta in base['venues'].items():
              if meta['cycle_start']<start.isoformat():continue
              for mno,record in meta['motors'].items():
                  derived=counts.get((vname,mno),0)+sum(status_counts.get((vname,mno,st),0)+other_start_counts.get((vname,mno,st),0) for st in preferred)
                  delta=derived-int(record['n'])
                  if delta:
                      venue_residual[vname]=venue_residual.get(vname,0)+1
                      if len(residual)<150:
                          residual.append({'venue':vname,'motor':mno,'baseline_n':record['n'],
                              'K_derived_n':derived,'diff':delta,'cycle':meta['cycle_start'],
                              'excluded_current_meet_start':meta['event_start'],
                              'statuses':{st:status_counts.get((vname,mno,st),0) for st in ('F','S0','S1','S2')}})
          # Machine-readable release gates: never infer permission to publish
          # from the highest-scoring retrospective counting policy.
          validation_gates={
              'official_days_complete':days_good==(end-start).days+1 and not missing and not errors,
              'all_baseline_motor_counts_match':candidate_residual_samples==[],
              'counting_policy_independently_validated':False,
              'finals_and_wins_verified':False,
              'all_24_venues_cycle_verified':False,
          }
          validation_gates['can_publish_motor_detail']=all(validation_gates.values())
          # Explicitly fail the research audit if a future edit accidentally
          # makes release possible without independent validation.
          assert not validation_gates['can_publish_motor_detail'], 'Unexpected motor publication gate: investigate before release'
          report={'validation_gates':validation_gates,'status_totals':{st:sum(n for (v,m,s),n in status_counts.items() if s==st) for st in sorted({k[2] for k in status_counts})},
              'other_status_totals':{st:sum(n for (v,m,s),n in other_start_counts.items() if s==st) for st in sorted({k[2] for k in other_start_counts})},
              'candidate_n_definitions':variants,
              'candidate_policy_residual_by_venue':candidate_residual_by_venue,
              'candidate_policy_residual_samples':candidate_residual_samples,
              'candidate_policy_not_approved':True,
              'candidate_residual_delta_histogram':candidate_residual_delta_histogram,
              'candidate_residual_boundary_groups':candidate_residual_boundary_groups,
              'best_candidate_N_policies':best_variants,
              'per_venue_research_best_status_policy':per_venue_best,
              'per_venue_policy_warning':'Retrospective fit on 2026-09-05 only. Do not apply to production N.',
              'best_policy_residuals':residual,'best_policy_residuals_by_venue':venue_residual,
              'unparsed_race_row_labels':dict(unparsed_codes),'unparsed_race_row_examples':unparsed_samples,
              'nonfinish_race_row_labels':dict(no_finisher_codes),
              'snapshot_reference':'2026-09-05','period_start':start.isoformat(),
              'days_expected':(end-start).days+1,'days_parsed':days_good,
              'days_missing':len(missing),'missing_examples':missing[:20],
              'days_parse_errors':len(errors),'parse_errors':errors,
              'finisher_motor_joins':joined,
              'motor_rows_compared':compared,'exact_baseline_n_matches':exact,
              'sample_nonmatches':examples,'app_data_published':False,
              'release_decision':'NO_GO: official finished-row count may differ from motor-start N; verify total-cycle accounting and meet boundaries'}
          pathlib.Path('motor_official_K_baseline_audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('parse_errors','sample_nonmatches')},ensure_ascii=False))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(f"Motor K audit: parsed {days_good} days, {exact}/{compared} numeric-only N cells matched. NO PUBLISH.\n")
              f.write("### Best retrospective policy (NOT approved for production)\n")
              if best_variants:
                  top=best_variants[0]
                  f.write(f"{top['exact']}/{top['total']} matched; total absolute difference {top['absolute_difference_sum']} starts.\n")
              f.write("### Remaining count deltas\n")
              for delta,n in sorted(candidate_residual_delta_histogram.items(),key=lambda x:int(x[0])):
                  f.write(f"- Delta {delta}: {n} motors\n")
              f.write("### Meeting-boundary cohorts\n")
              for group,info in candidate_residual_boundary_groups.items():
                  f.write(f"- {group}: {info['motors']} motors / {info['abs_delta']} starts\n")
              f.write(f"### Release decision: {'GO' if validation_gates['can_publish_motor_detail'] else 'NO GO'}\n")
          PY
      - name: Save research-only motor K audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brc-motor-official-k-readonly-audit
          path: motor_official_K_baseline_audit.json
          if-no-files-found: ignore
          retention-days: 14
