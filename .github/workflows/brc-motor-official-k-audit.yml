name: BRC Motor Official K Historical Audit (NO PUBLISH)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/brc-motor-official-k-audit.yml'
permissions:
  contents: read
jobs:
  historical-motor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified official K files from prior course365 runs
        uses: actions/cache/restore@v4
        with:
          path: .cache/brc-course365-k
          key: brc-motor-k-audit-no-write
          restore-keys: |
            brc-course365-k-
      - name: Count actual official K motor starts versus frozen BRC baseline
        shell: bash
        run: |
          python - <<'PY'
          import collections,json,pathlib,re,sys
          from datetime import date,timedelta
          sys.path.insert(0,'scripts')
          import BRC_PLAYER_COURSE365_V3_OFFICIAL as official
          manifest=json.loads(pathlib.Path('data/.brc_split_manifest.json').read_text(encoding='utf-8'))
          files=[f for f in manifest['files'] if re.fullmatch(r'data-motor-detail-[0-9a-f]+-001\.js',f)]
          if len(files)!=1:raise ValueError('BRC motor reference missing')
          js=(pathlib.Path('data')/files[0]).read_text(encoding='utf-8')
          chunks=re.findall(r'e\.textContent\s*\+=\s*("(?:\\.|[^"\\])*")',js,re.S)
          if not chunks:raise ValueError('Motor reference decoder failed')
          base=json.loads(''.join(json.loads(s) for s in chunks))
          if base.get('date')!='2026-09-05':raise ValueError('Unexpected baseline date')
          venues='桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村'.split()
          venue_by_code={f'{i:02d}':n for i,n in enumerate(venues,1)}
          root=pathlib.Path('.cache/brc-course365-k')
          official_files=official.discover_k(root) if root.exists() else {}
          start=date(2025,9,23);end=date(2026,9,5);day=start
          counts=collections.Counter();missing=[];errors=[];days_good=0;joined=0
          motor_pat=re.compile(r'\s+(\d{1,3})\s+\d{1,3}\s+\d(?:\.\d{1,2})?\s+[1-6]\s+')
          venue_pat=official.RE_VENUE_START;end_pat=official.RE_VENUE_END
          while day<=end:
              file=official_files.get(day)
              if file is None:
                  missing.append(day.isoformat());day+=timedelta(days=1);continue
              try:
                  content=file.read_text(encoding='cp932',errors='strict')
                  events,n_races,_=official.official_k_events(content,day)
                  expected={(v,r,b,reg,rank) for _,v,r,b,reg,_,rank in events}
                  matches={};venue=None;race=None
                  for line in content.splitlines():
                      v=venue_pat.match(line)
                      if v:venue=v.group(1);race=None;continue
                      if end_pat.match(line):venue=None;race=None;continue
                      if venue is None:continue
                      rm=official.RE_RACE.match(line)
                      if rm:race=int(rm.group(1));continue
                      if race is None:continue
                      m=official.RE_ENTRY.match(line)
                      if not m:continue
                      rank_s,boat_s,reg,body=m.groups()
                      if not rank_s.isdigit() or not 1<=int(rank_s)<=6:continue
                      key=(venue,race,int(boat_s),reg,int(rank_s))
                      if key not in expected:continue
                      mm=motor_pat.search(body)
                      if mm is None:raise ValueError('No motor for validated numeric finisher '+str(key))
                      if key in matches:raise ValueError('Duplicate finisher')
                      matches[key]=str(int(mm.group(1)))
                  if set(matches)!=expected:
                      raise ValueError(f'Motor/race join incomplete: {len(matches)}/{len(expected)}')
                  for (code,race,boat,reg,rank),motor in matches.items():
                      name=venue_by_code[code];meta=base['venues'][name]
                      if meta['cycle_start']<=day.isoformat()<meta['event_start']:
                          counts[name,motor]+=1
                  days_good+=1;joined+=len(matches)
              except Exception as err:
                  if len(errors)<35:errors.append(f'{day} {type(err).__name__}: {str(err)[:160]}')
              day+=timedelta(days=1)
          exact=0;compared=0;examples=[]
          for venue,meta in base['venues'].items():
              if meta['cycle_start']<start.isoformat():continue
              for motor,record in meta['motors'].items():
                  compared+=1;got=counts.get((venue,motor),0);expected_n=int(record['n'])
                  if got==expected_n:exact+=1
                  elif len(examples)<30:
                      examples.append({'venue':venue,'motor':motor,'old_n':expected_n,'official_numeric_finishes':got})
          report={'snapshot_reference':'2026-09-05','period_start':start.isoformat(),
              'days_expected':(end-start).days+1,'days_parsed':days_good,
              'days_missing':len(missing),'missing_examples':missing[:20],
              'days_parse_errors':len(errors),'parse_errors':errors,
              'finisher_motor_joins':joined,
              'motor_rows_compared':compared,'exact_baseline_n_matches':exact,
              'sample_nonmatches':examples,'app_data_published':False,
              'release_decision':'NO_GO: official finished-row count may differ from motor-start N; verify total-cycle accounting and meet boundaries'}
          pathlib.Path('motor_official_K_baseline_audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in ('parse_errors','sample_nonmatches')},ensure_ascii=False))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(f"Motor K audit: parsed {days_good} days, {exact}/{compared} N cells matched. NO PUBLISH.\n")
          PY
      - name: Save research-only motor K audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brc-motor-official-k-readonly-audit
          path: motor_official_K_baseline_audit.json
          if-no-files-found: ignore
          retention-days: 14
