name: BRC V3 Daily Verified Staging Context (STAGE ONLY)
on:
  workflow_dispatch:
  schedule:
    # JST morning: start 04:17, recheck frequently before early exhibitions.
    # Offset minutes from :00 to reduce GitHub Actions peak-load delays.
    # Retries are safe: publisher verifies current JST official TXT and stage-only manifest.
    - cron: '17,47 19,20,21 * * *'  # JST 04:17/04:47,05:17/05:47,06:17/06:47
    - cron: '7,22,37,52 22,23 * * *' # JST 07:07..08:52 (15-minute cadence)
    - cron: '17 0,1,2,3 * * *'      # JST 09:17,10:17,11:17,12:17
permissions:
  contents: read
concurrency:
  group: brc-v3-stage-daily-verified
  cancel-in-progress: false
jobs:
  verified-stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source, manifest, 6-boat checks; publish ONLY approved meetings
        env:
          BRC_V3_STAGE_INGEST_KEY: ${{ secrets.BRC_V3_STAGE_INGEST_KEY }}
        run: python scripts/brc_v3_stage_daily.py --publish
      - name: Store sanitized stage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brc-v3-daily-stage-summary-${{ github.run_id }}
          path: brc_v3_daily_stage_summary.json
          if-no-files-found: warn
          retention-days: 7
