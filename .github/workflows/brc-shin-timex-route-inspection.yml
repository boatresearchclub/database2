name: BRC True TimeX - route inspection (read-only)
on:
  push:
    branches: [research/shin-timex-readonly-probe-20261020]
permissions:
  contents: read
jobs:
  route-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safe staging API read-only inspection
        shell: bash
        run: |
          set -uo pipefail
          timex='https://brc-timex-v3-test.sk48159212.workers.dev'
          live='https://brc-live-exhibition.sk48159212.workers.dev'
          probe() {
            label="$1"; url="$2"
            code=$(curl --silent --show-error --connect-timeout 8 --max-time 15 \
              --max-redirs 0 --output /dev/null --write-out '%{http_code}' \
              --header 'Cache-Control: no-store' -- "$url") || {
                echo "$label transport_error"; return 0;
              }
            echo "$label http=$code"
          }
          probe 'v3_noauth_predict' "$timex/predict-timex-v3"
          probe 'live_health' "$live/health"
          probe 'live_current_result_v1_invalid_query' "$live/live-result"
          probe 'live_candidate_v2_missing_query' "$live/live-result-v2"
          probe 'live_candidate_v2_valid_query_noauth' "$live/live-result-v2?date=2026-10-20&venue_code=21&race_no=1"
          probe 'live_candidate_special_status_v22' "$live/live-result-special-status-v2"
          probe 'live_candidate_partial_observation_v21' "$live/live-result-top3-observation-v2"
          echo 'Health metadata, explicitly allowlisted keys only:'
          curl --silent --show-error --max-time 15 --fail "$live/health" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); allowed=("ok","service","phase","mode","result_store","result_store_bound"); print({k:d.get(k) for k in allowed if k in d})' || \
            echo 'health_metadata_unavailable'
          echo 'GET only; no auth, no writes, no result/prediction bodies retained'
